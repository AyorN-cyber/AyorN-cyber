<svg xmlns="http://www.w3.org/2000/svg" width="590" height="386" viewBox="0 0 590 386" role="img" aria-label="SMS abuse mitigation. Responded to an SMS pumping attack on the sign-up flow of an advocacy platform."><title>SMS abuse mitigation. Responded to an SMS pumping attack on the sign-up flow of an advocacy platform.</title><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#252825"/></pattern></defs><rect width="590" height="386" fill="#0D0E0D"/><rect width="590" height="386" fill="url(#g)"/><rect x="0.75" y="0.75" width="588.5" height="384.5" fill="none" stroke="#2B2E2B" stroke-width="1.5"/><path d="M8 17V8H17 M573 8H582V17 M8 369V378H17 M573 378H582V369" fill="none" stroke="#8E928B" stroke-width="1.5"/><text x="32" y="42" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="600" fill="#8E928B" text-anchor="start" letter-spacing="2" >CLIENT WORK  /  SECURITY</text><text x="32" y="84" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="800" fill="#EEEBE4" text-anchor="start" letter-spacing="-0.5" >SMS abuse mitigation</text><text x="32" y="114" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C6BF" text-anchor="start" letter-spacing="0" >Responded to an SMS pumping attack on the sign-up flow of an</text><text x="32" y="135" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C6BF" text-anchor="start" letter-spacing="0" >advocacy platform.</text><rect x="32" y="157" width="5" height="5" fill="#FF4F2B"/><text x="50" y="165" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Coordinated the mitigation with an external security team.</text><rect x="32" y="185" width="5" height="5" fill="#FF4F2B"/><text x="50" y="193" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Shipped protections behind feature flags so they could be</text><text x="50" y="212" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >switched without a redeploy.</text><rect x="32" y="232" width="5" height="5" fill="#FF4F2B"/><text x="50" y="240" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Rebuilt the project board across seven phases so follow-up</text><text x="50" y="259" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >work stayed visible.</text><line x1="32" y1="312" x2="558" y2="312" stroke="#2B2E2B"/><text x="32" y="338" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="600" fill="#8E928B" text-anchor="start" letter-spacing="1.5" >FEATURE FLAGS  /  SMS SECURITY  /  PROJECT OPS</text><text x="32" y="362" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8E928B" text-anchor="start" letter-spacing="1.5" >PRIVATE WORK  /  WALKTHROUGH ON REQUEST</text></svg>