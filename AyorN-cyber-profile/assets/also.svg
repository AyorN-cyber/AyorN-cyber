<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="294" viewBox="0 0 1200 294" role="img" aria-label="Also built"><title>Also built</title><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#252825"/></pattern></defs><rect width="1200" height="294" fill="#0D0E0D"/><rect width="1200" height="294" fill="url(#g)"/><path d="M10 20V10H20 M1180 10H1190V20 M10 274V284H20 M1180 284H1190V274" fill="none" stroke="#8E928B" stroke-width="1.5"/><text x="48" y="66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#FF4F2B" text-anchor="start" letter-spacing="3" >INTERACTIVE PDFS</text><text x="300" y="67" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >A fillable membership covenant form with conditional layout, set in the brand colours.</text><line x1="48" y1="86" x2="1152" y2="86" stroke="#2B2E2B"/><text x="48" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#FF4F2B" text-anchor="start" letter-spacing="3" >PRINT AND IDENTITY</text><text x="300" y="113" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >CR80 staff ID cards in portrait and landscape, and a full redesign of a company profile document.</text><line x1="48" y1="132" x2="1152" y2="132" stroke="#2B2E2B"/><text x="48" y="158" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#FF4F2B" text-anchor="start" letter-spacing="3" >PROGRAMMATIC VIDEO</text><text x="300" y="159" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >A Remotion pipeline designed to render ten videos a day.</text><line x1="48" y1="178" x2="1152" y2="178" stroke="#2B2E2B"/><text x="48" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#FF4F2B" text-anchor="start" letter-spacing="3" >BOOK TOOLING</text><text x="300" y="205" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >A KDP book-formatting service packaged as a command line tool.</text><line x1="48" y1="224" x2="1152" y2="224" stroke="#2B2E2B"/><text x="48" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#FF4F2B" text-anchor="start" letter-spacing="3" >HARDWARE CONCEPT</text><text x="300" y="251" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >An always-on companion device for remote laptop access without cloud routing, specced with diagrams and costs.</text><line x1="48" y1="270" x2="1152" y2="270" stroke="#2B2E2B"/></svg>