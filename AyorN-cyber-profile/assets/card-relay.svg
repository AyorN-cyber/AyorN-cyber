<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="414" viewBox="0 0 1200 414" role="img" aria-label="Winnow Relay. A Windows desktop browser where an AI agent does the browsing, built around bring-your-own-key so users keep control of their models and their data."><title>Winnow Relay. A Windows desktop browser where an AI agent does the browsing, built around bring-your-own-key so users keep control of their models and their data.</title><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#252825"/></pattern></defs><rect width="1200" height="414" fill="#0D0E0D"/><rect width="1200" height="414" fill="url(#g)"/><rect x="0.75" y="0.75" width="1198.5" height="412.5" fill="none" stroke="#FF4F2B" stroke-width="1.5"/><path d="M8 17V8H17 M1183 8H1192V17 M8 397V406H17 M1183 406H1192V397" fill="none" stroke="#FF4F2B" stroke-width="1.5"/><text x="32" y="42" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="600" fill="#FF4F2B" text-anchor="start" letter-spacing="2" >FLAGSHIP  /  DESKTOP AGENT  /  FOUNDING BETA</text><text x="32" y="84" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="800" fill="#EEEBE4" text-anchor="start" letter-spacing="-0.5" >Winnow Relay</text><text x="32" y="114" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C6BF" text-anchor="start" letter-spacing="0" >A Windows desktop browser where an AI agent does the browsing, built around bring-your-own-key so users keep control of their models</text><text x="32" y="135" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C6BF" text-anchor="start" letter-spacing="0" >and their data.</text><rect x="32" y="157" width="5" height="5" fill="#FF4F2B"/><text x="50" y="165" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Agent browser with computer use, collapsible browser and panels, and a chat-only mode, wrapped in a custom interface identity instead</text><text x="50" y="184" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >of a stock chat template.</text><rect x="32" y="204" width="5" height="5" fill="#FF4F2B"/><text x="50" y="212" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Reliability pass on AI-written code: inventoried every fallback the AI had added, then gave each one a verdict to keep, fix or remove.</text><rect x="32" y="232" width="5" height="5" fill="#FF4F2B"/><text x="50" y="240" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Data safety: nine local stores now quarantine corrupt files instead of overwriting them, with atomic writes and a repaired write queue</text><text x="50" y="259" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >for the key vault.</text><rect x="32" y="279" width="5" height="5" fill="#FF4F2B"/><text x="50" y="287" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Design fidelity rebuild checked by a pixel-diff harness, plus a loop guard that stops read-only agent runs from spinning.</text><line x1="32" y1="340" x2="1168" y2="340" stroke="#2B2E2B"/><text x="32" y="366" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="600" fill="#8E928B" text-anchor="start" letter-spacing="1.5" >TYPESCRIPT  /  DESKTOP  /  BROWSER AGENTS  /  BYOK</text><text x="32" y="390" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="600" fill="#FF4F2B" text-anchor="start" letter-spacing="0" >-> winnowhq.com</text><svg x="1118" y="376" width="20" height="20" viewBox="0 0 24 24"><path d="M1.125 0C.502 0 0 .502 0 1.125v21.75C0 23.498.502 24 1.125 24h21.75c.623 0 1.125-.502 1.125-1.125V1.125C24 .502 23.498 0 22.875 0zm17.363 9.75c.612 0 1.154.037 1.627.111a6.38 6.38 0 0 1 1.306.34v2.458a3.95 3.95 0 0 0-.643-.361 5.093 5.093 0 0 0-.717-.26 5.453 5.453 0 0 0-1.426-.2c-.3 0-.573.028-.819.086a2.1 2.1 0 0 0-.623.242c-.17.104-.3.229-.393.374a.888.888 0 0 0-.14.49c0 .196.053.373.156.529.104.156.252.304.443.444s.423.276.696.41c.273.135.582.274.926.416.47.197.892.407 1.266.628.374.222.695.473.963.753.268.279.472.598.614.957.142.359.214.776.214 1.253 0 .657-.125 1.21-.373 1.656a3.033 3.033 0 0 1-1.012 1.085 4.38 4.38 0 0 1-1.487.596c-.566.12-1.163.18-1.79.18a9.916 9.916 0 0 1-1.84-.164 5.544 5.544 0 0 1-1.512-.493v-2.63a5.033 5.033 0 0 0 3.237 1.2c.333 0 .624-.03.872-.09.249-.06.456-.144.623-.25.166-.108.29-.234.373-.38a1.023 1.023 0 0 0-.074-1.089 2.12 2.12 0 0 0-.537-.5 5.597 5.597 0 0 0-.807-.444 27.72 27.72 0 0 0-1.007-.436c-.918-.383-1.602-.852-2.053-1.405-.45-.553-.676-1.222-.676-2.005 0-.614.123-1.141.369-1.582.246-.441.58-.804 1.004-1.089a4.494 4.494 0 0 1 1.47-.629 7.536 7.536 0 0 1 1.77-.201zm-15.113.188h9.563v2.166H9.506v9.646H6.789v-9.646H3.375z" fill="#3178C6"/></svg><svg x="1146" y="376" width="20" height="20" viewBox="0 0 24 24"><path d="M17.3041 3.541h-3.6718l6.696 16.918H24Zm-10.6082 0L0 20.459h3.7442l1.3693-3.5527h7.0052l1.3693 3.5528h3.7442L10.5363 3.5409Zm-.3712 10.2232 2.2914-5.9456 2.2914 5.9456Z" fill="#EEEBE4"/></svg></svg>