<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="414" viewBox="0 0 1200 414" role="img" aria-label="Winnow Relay. A Windows desktop browser where an AI agent does the browsing, built around bring-your-own-key so users keep control of their models and their data."><title>Winnow Relay. A Windows desktop browser where an AI agent does the browsing, built around bring-your-own-key so users keep control of their models and their data.</title><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#252825"/></pattern></defs><rect width="1200" height="414" fill="#0D0E0D"/><rect width="1200" height="414" fill="url(#g)"/><rect x="0.75" y="0.75" width="1198.5" height="412.5" fill="none" stroke="#FF4F2B" stroke-width="1.5"/><path d="M8 17V8H17 M1183 8H1192V17 M8 397V406H17 M1183 406H1192V397" fill="none" stroke="#FF4F2B" stroke-width="1.5"/><text x="32" y="42" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="600" fill="#FF4F2B" text-anchor="start" letter-spacing="2" >FLAGSHIP  /  DESKTOP AGENT  /  FOUNDING BETA</text><text x="32" y="84" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="800" fill="#EEEBE4" text-anchor="start" letter-spacing="-0.5" >Winnow Relay</text><text x="32" y="114" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C6BF" text-anchor="start" letter-spacing="0" >A Windows desktop browser where an AI agent does the browsing, built around bring-your-own-key so users keep control of their models</text><text x="32" y="135" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C6BF" text-anchor="start" letter-spacing="0" >and their data.</text><rect x="32" y="157" width="5" height="5" fill="#FF4F2B"/><text x="50" y="165" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Agent browser with computer use, collapsible browser and panels, and a chat-only mode, wrapped in a custom interface identity instead</text><text x="50" y="184" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >of a stock chat template.</text><rect x="32" y="204" width="5" height="5" fill="#FF4F2B"/><text x="50" y="212" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Reliability pass on AI-written code: inventoried every fallback the AI had added, then gave each one a verdict to keep, fix or remove.</text><rect x="32" y="232" width="5" height="5" fill="#FF4F2B"/><text x="50" y="240" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Data safety: nine local stores now quarantine corrupt files instead of overwriting them, with atomic writes and a repaired write queue</text><text x="50" y="259" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >for the key vault.</text><rect x="32" y="279" width="5" height="5" fill="#FF4F2B"/><text x="50" y="287" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Design fidelity rebuild checked by a pixel-diff harness, plus a loop guard that stops read-only agent runs from spinning.</text><line x1="32" y1="340" x2="1168" y2="340" stroke="#2B2E2B"/><text x="32" y="366" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="600" fill="#8E928B" text-anchor="start" letter-spacing="1.5" >TYPESCRIPT  /  DESKTOP  /  BROWSER AGENTS  /  BYOK</text><text x="32" y="390" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="600" fill="#FF4F2B" text-anchor="start" letter-spacing="0" >-> winnowhq.com</text></svg>