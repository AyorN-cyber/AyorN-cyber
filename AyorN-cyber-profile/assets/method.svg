<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Method: inventory, reproduce, fix, verify"><title>Method: inventory, reproduce, fix, verify</title><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#252825"/></pattern></defs><rect width="1200" height="230" fill="#0D0E0D"/><rect width="1200" height="230" fill="url(#g)"/><path d="M10 20V10H20 M1180 10H1190V20 M10 210V220H20 M1180 220H1190V210" fill="none" stroke="#8E928B" stroke-width="1.5"/><text x="48" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#FF4F2B" text-anchor="start" letter-spacing="4" >INVENTORY</text><line x1="48" y1="72" x2="280" y2="72" stroke="#2B2E2B"/><text x="48" y="104" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Read-only first. List</text><text x="48" y="129" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >every fallback, secret,</text><text x="48" y="154" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >route and permission</text><text x="48" y="179" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >before changing anything.</text><path d="M298 52L310 62L298 72Z" fill="#FF4F2B"/><text x="330" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#FF4F2B" text-anchor="start" letter-spacing="4" >REPRODUCE</text><line x1="330" y1="72" x2="562" y2="72" stroke="#2B2E2B"/><text x="330" y="104" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Prove each finding in the</text><text x="330" y="129" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >running app. Disprove the</text><text x="330" y="154" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >ones that are not real.</text><path d="M580 52L592 62L580 72Z" fill="#FF4F2B"/><text x="612" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#FF4F2B" text-anchor="start" letter-spacing="4" >FIX</text><line x1="612" y1="72" x2="844" y2="72" stroke="#2B2E2B"/><text x="612" y="104" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Phased changes, riskiest</text><text x="612" y="129" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >first. Data loss and</text><text x="612" y="154" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >authentication before</text><text x="612" y="179" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >polish.</text><path d="M862 52L874 62L862 72Z" fill="#FF4F2B"/><text x="894" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#FF4F2B" text-anchor="start" letter-spacing="4" >VERIFY</text><line x1="894" y1="72" x2="1126" y2="72" stroke="#2B2E2B"/><text x="894" y="104" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Launch it, test it as a</text><text x="894" y="129" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >user, then call it done.</text><text x="894" y="154" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Not before.</text></svg>