<svg xmlns="http://www.w3.org/2000/svg" width="590" height="464" viewBox="0 0 590 464" role="img" aria-label="Owner&#x27;s document desk. A private app that lets a business owner produce quotations, invoices and letters from a phone, with an assistant that does the typing."><title>Owner&#x27;s document desk. A private app that lets a business owner produce quotations, invoices and letters from a phone, with an assistant that does the typing.</title><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#252825"/></pattern></defs><rect width="590" height="464" fill="#0D0E0D"/><rect width="590" height="464" fill="url(#g)"/><rect x="0.75" y="0.75" width="588.5" height="462.5" fill="none" stroke="#2B2E2B" stroke-width="1.5"/><path d="M8 17V8H17 M573 8H582V17 M8 447V456H17 M573 456H582V447" fill="none" stroke="#8E928B" stroke-width="1.5"/><text x="32" y="42" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="600" fill="#8E928B" text-anchor="start" letter-spacing="2" >CLIENT WORK  /  PRIVATE WEB APP</text><text x="32" y="84" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="800" fill="#EEEBE4" text-anchor="start" letter-spacing="-0.5" >Owner&#x27;s document desk</text><text x="32" y="114" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C6BF" text-anchor="start" letter-spacing="0" >A private app that lets a business owner produce quotations,</text><text x="32" y="135" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C6BF" text-anchor="start" letter-spacing="0" >invoices and letters from a phone, with an assistant that does</text><text x="32" y="156" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C6BF" text-anchor="start" letter-spacing="0" >the typing.</text><rect x="32" y="178" width="5" height="5" fill="#FF4F2B"/><text x="50" y="186" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Live A4 preview with true pagination: footer on every page,</text><text x="50" y="205" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >letterhead on page one, export to PDF or DOCX as single</text><text x="50" y="224" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >documents or combined packs.</text><rect x="32" y="244" width="5" height="5" fill="#FF4F2B"/><text x="50" y="252" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >The assistant drafts from a prompt or a photo of a</text><text x="50" y="271" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >handwritten note, and asks for missing details before it</text><text x="50" y="290" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >builds.</text><rect x="32" y="310" width="5" height="5" fill="#FF4F2B"/><text x="50" y="318" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Rate limits, audit log and chat context live in Redis, so a</text><text x="50" y="337" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >small API budget lasts.</text><line x1="32" y1="390" x2="558" y2="390" stroke="#2B2E2B"/><text x="32" y="416" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="600" fill="#8E928B" text-anchor="start" letter-spacing="1.5" >ANTHROPIC API  /  REDIS  /  PWA  /  PDF + DOCX</text><text x="32" y="440" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8E928B" text-anchor="start" letter-spacing="1.5" >PRIVATE WORK  /  WALKTHROUGH ON REQUEST</text></svg>