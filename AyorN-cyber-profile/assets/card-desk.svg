<svg xmlns="http://www.w3.org/2000/svg" width="590" height="464" viewBox="0 0 590 464" role="img" aria-label="Owner&#x27;s document desk. A private app that lets a business owner produce quotations, invoices and letters from a phone, with an assistant that does the typing."><title>Owner&#x27;s document desk. A private app that lets a business owner produce quotations, invoices and letters from a phone, with an assistant that does the typing.</title><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#252825"/></pattern></defs><rect width="590" height="464" fill="#0D0E0D"/><rect width="590" height="464" fill="url(#g)"/><rect x="0.75" y="0.75" width="588.5" height="462.5" fill="none" stroke="#2B2E2B" stroke-width="1.5"/><path d="M8 17V8H17 M573 8H582V17 M8 447V456H17 M573 456H582V447" fill="none" stroke="#8E928B" stroke-width="1.5"/><text x="32" y="42" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="600" fill="#8E928B" text-anchor="start" letter-spacing="2" >CLIENT WORK  /  PRIVATE WEB APP</text><text x="32" y="84" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="800" fill="#EEEBE4" text-anchor="start" letter-spacing="-0.5" >Owner&#x27;s document desk</text><text x="32" y="114" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C6BF" text-anchor="start" letter-spacing="0" >A private app that lets a business owner produce quotations,</text><text x="32" y="135" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C6BF" text-anchor="start" letter-spacing="0" >invoices and letters from a phone, with an assistant that does</text><text x="32" y="156" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C6BF" text-anchor="start" letter-spacing="0" >the typing.</text><rect x="32" y="178" width="5" height="5" fill="#FF4F2B"/><text x="50" y="186" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Live A4 preview with true pagination: footer on every page,</text><text x="50" y="205" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >letterhead on page one, export to PDF or DOCX as single</text><text x="50" y="224" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >documents or combined packs.</text><rect x="32" y="244" width="5" height="5" fill="#FF4F2B"/><text x="50" y="252" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >The assistant drafts from a prompt or a photo of a</text><text x="50" y="271" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >handwritten note, and asks for missing details before it</text><text x="50" y="290" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >builds.</text><rect x="32" y="310" width="5" height="5" fill="#FF4F2B"/><text x="50" y="318" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Rate limits, audit log and chat context live in Redis, so a</text><text x="50" y="337" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >small API budget lasts.</text><line x1="32" y1="390" x2="558" y2="390" stroke="#2B2E2B"/><text x="32" y="416" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="600" fill="#8E928B" text-anchor="start" letter-spacing="1.5" >ANTHROPIC API  /  REDIS  /  PWA  /  PDF + DOCX</text><text x="32" y="440" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8E928B" text-anchor="start" letter-spacing="1.5" >PRIVATE WORK  /  WALKTHROUGH ON REQUEST</text><svg x="508" y="426" width="20" height="20" viewBox="0 0 24 24"><path d="M17.3041 3.541h-3.6718l6.696 16.918H24Zm-10.6082 0L0 20.459h3.7442l1.3693-3.5527h7.0052l1.3693 3.5528h3.7442L10.5363 3.5409Zm-.3712 10.2232 2.2914-5.9456 2.2914 5.9456Z" fill="#EEEBE4"/></svg><svg x="536" y="426" width="20" height="20" viewBox="0 0 24 24"><path d="M22.71 13.145c-1.66 2.092-3.452 4.483-7.038 4.483-3.203 0-4.397-2.825-4.48-5.12.701 1.484 2.073 2.685 4.214 2.63 4.117-.133 6.94-3.852 6.94-7.239 0-4.05-3.022-6.972-8.268-6.972-3.752 0-8.4 1.428-11.455 3.685C2.59 6.937 3.885 9.958 4.35 9.626c2.648-1.904 4.748-3.13 6.784-3.744C8.12 9.244.886 17.05 0 18.425c.1 1.261 1.66 4.648 2.424 4.648.232 0 .431-.133.664-.365a100.49 100.49 0 0 0 5.54-6.765c.222 3.104 1.748 6.898 6.014 6.898 3.819 0 7.604-2.756 9.33-8.965.2-.764-.73-1.361-1.261-.73zm-4.349-5.013c0 1.959-1.926 2.922-3.685 2.922-.941 0-1.664-.247-2.235-.568 1.051-1.592 2.092-3.225 3.21-4.973 1.972.334 2.71 1.43 2.71 2.619z" fill="#FF4438"/></svg></svg>