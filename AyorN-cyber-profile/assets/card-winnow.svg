<svg xmlns="http://www.w3.org/2000/svg" width="590" height="464" viewBox="0 0 590 464" role="img" aria-label="Winnow. Buyer-intelligence reports built from Reddit conversations, so founders see who is ready to buy and how to reach them."><title>Winnow. Buyer-intelligence reports built from Reddit conversations, so founders see who is ready to buy and how to reach them.</title><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#252825"/></pattern></defs><rect width="590" height="464" fill="#0D0E0D"/><rect width="590" height="464" fill="url(#g)"/><rect x="0.75" y="0.75" width="588.5" height="462.5" fill="none" stroke="#2B2E2B" stroke-width="1.5"/><path d="M8 17V8H17 M573 8H582V17 M8 447V456H17 M573 456H582V447" fill="none" stroke="#8E928B" stroke-width="1.5"/><text x="32" y="42" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="600" fill="#8E928B" text-anchor="start" letter-spacing="2" >OWN PRODUCT  /  RESEARCH</text><text x="32" y="84" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="800" fill="#EEEBE4" text-anchor="start" letter-spacing="-0.5" >Winnow</text><text x="32" y="114" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C6BF" text-anchor="start" letter-spacing="0" >Buyer-intelligence reports built from Reddit conversations, so</text><text x="32" y="135" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C6BF" text-anchor="start" letter-spacing="0" >founders see who is ready to buy and how to reach them.</text><rect x="32" y="157" width="5" height="5" fill="#FF4F2B"/><text x="50" y="165" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Two-stage scoring pipeline that ranks every lead by</text><text x="50" y="184" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >reachability, from a direct contact surface down to a Reddit</text><text x="50" y="203" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >handle only.</text><rect x="32" y="223" width="5" height="5" fill="#FF4F2B"/><text x="50" y="231" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Voice pass on every draft report to strip the cadence that</text><text x="50" y="250" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >makes AI writing easy to spot.</text><rect x="32" y="270" width="5" height="5" fill="#FF4F2B"/><text x="50" y="278" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Hardened delivery with HSTS, frame and referrer-policy</text><text x="50" y="297" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >headers set at the host.</text><line x1="32" y1="390" x2="558" y2="390" stroke="#2B2E2B"/><text x="32" y="416" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="600" fill="#8E928B" text-anchor="start" letter-spacing="1.5" >NEXT.JS  /  TYPESCRIPT  /  DRIZZLE  /  NEON  /  ANTHROPIC SDK</text><text x="32" y="440" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="600" fill="#FF4F2B" text-anchor="start" letter-spacing="0" >-> wi