<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="How I work: shape, build, verify"><title>How I work: shape, build, verify</title><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#252825"/></pattern></defs><rect width="1200" height="210" fill="#0D0E0D"/><rect width="1200" height="210" fill="url(#g)"/><path d="M10 20V10H20 M1180 10H1190V20 M10 190V200H20 M1180 200H1190V190" fill="none" stroke="#8E928B" stroke-width="1.5"/><text x="48" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#FF4F2B" text-anchor="start" letter-spacing="4" >SHAPE</text><line x1="48" y1="72" x2="378" y2="72" stroke="#2B2E2B"/><text x="48" y="106" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Define the problem and the interaction</text><text x="48" y="132" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >before any code. A clear problem keeps</text><text x="48" y="158" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >every later decision cheap.</text><text x="420" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#FF4F2B" text-anchor="start" letter-spacing="4" >BUILD</text><line x1="420" y1="72" x2="750" y2="72" stroke="#2B2E2B"/><text x="420" y="106" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Move from prototype to a working backend</text><text x="420" y="132" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >flow fast, then polish the interface</text><text x="420" y="158" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >until it feels direct.</text><text x="792" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#FF4F2B" text-anchor="start" letter-spacing="4" >VERIFY</text><line x1="792" y1="72" x2="1122" y2="72" stroke="#2B2E2B"/><text x="792" y="106" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >AI output is a draft. I audit it, run it</text><text x="792" y="132" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >in the real app, and remove code that</text><text x="792" y="158" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >hides failures.</text></svg>