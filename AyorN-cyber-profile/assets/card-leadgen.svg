<svg xmlns="http://www.w3.org/2000/svg" width="590" height="424" viewBox="0 0 590 424" role="img" aria-label="Lead-generation pipelines. Prospecting systems across six campaign verticals, built to feed email outreach with verified contacts."><title>Lead-generation pipelines. Prospecting systems across six campaign verticals, built to feed email outreach with verified contacts.</title><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#252825"/></pattern></defs><rect width="590" height="424" fill="#0D0E0D"/><rect width="590" height="424" fill="url(#g)"/><rect x="0.75" y="0.75" width="588.5" height="422.5" fill="none" stroke="#2B2E2B" stroke-width="1.5"/><path d="M8 17V8H17 M573 8H582V17 M8 407V416H17 M573 416H582V407" fill="none" stroke="#8E928B" stroke-width="1.5"/><text x="32" y="42" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="600" fill="#8E928B" text-anchor="start" letter-spacing="2" >CLIENT WORK  /  DATA</text><text x="32" y="84" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" font-weight="800" fill="#EEEBE4" text-anchor="start" letter-spacing="-0.5" >Lead-generation pipelines</text><text x="32" y="114" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C6BF" text-anchor="start" letter-spacing="0" >Prospecting systems across six campaign verticals, built to</text><text x="32" y="135" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#C9C6BF" text-anchor="start" letter-spacing="0" >feed email outreach with verified contacts.</text><rect x="32" y="157" width="5" height="5" fill="#FF4F2B"/><text x="50" y="165" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Over 2,800 verified contacts across two lists, with a</text><text x="50" y="184" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >consolidated export that reconciled both.</text><rect x="32" y="204" width="5" height="5" fill="#FF4F2B"/><text x="50" y="212" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Eight branded newsletters, each with its own waiting-list</text><text x="50" y="231" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >landing page.</text><rect x="32" y="251" width="5" height="5" fill="#FF4F2B"/><text x="50" y="259" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Verticals included colleges, city managers, soccer coaches</text><text x="50" y="278" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >and dispensaries.</text><line x1="32" y1="350" x2="558" y2="350" stroke="#2B2E2B"/><text x="32" y="376" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="600" fill="#8E928B" text-anchor="start" letter-spacing="1.5" >DATA COLLECTION  /  VERIFICATION  /  EMAIL AUTOMATION</text><text x="32" y="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#8E928B" text-anchor="start" letter-spacing="1.5" >PRIVATE WORK  /  WALKTHROUGH ON REQUEST</text></svg>