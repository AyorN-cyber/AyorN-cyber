<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="472" viewBox="0 0 1200 472" role="img" aria-label="What AI-built apps often ship versus what I ship"><title>What AI-built apps often ship versus what I ship</title><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#252825"/></pattern></defs><rect width="1200" height="472" fill="#0D0E0D"/><rect width="1200" height="472" fill="url(#g)"/><path d="M10 20V10H20 M1180 10H1190V20 M10 452V462H20 M1180 462H1190V452" fill="none" stroke="#8E928B" stroke-width="1.5"/><text x="48" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="600" fill="#8E928B" text-anchor="start" letter-spacing="3" >WHAT AI-BUILT APPS OFTEN SHIP</text><text x="640" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#FF4F2B" text-anchor="start" letter-spacing="3" >WHAT I SHIP</text><line x1="48" y1="78" x2="1152" y2="78" stroke="#2B2E2B"/><text x="48" y="104" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#6A6E68" text-anchor="start" letter-spacing="0" text-decoration="line-through">Default credentials left in the code</text><path d="M575 98H597M591 92L597 98L591 104" fill="none" stroke="#FF4F2B" stroke-width="1.6"/><rect x="640" y="92" width="10" height="10" fill="#FF4F2B"/><text x="664" y="104" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Real auth: signed sessions and scoped roles</text><line x1="48" y1="130" x2="1152" y2="130" stroke="#2B2E2B"/><text x="48" y="156" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#6A6E68" text-anchor="start" letter-spacing="0" text-decoration="line-through">Secrets sitting in git history</text><path d="M575 150H597M591 144L597 150L591 156" fill="none" stroke="#FF4F2B" stroke-width="1.6"/><rect x="640" y="144" width="10" height="10" fill="#FF4F2B"/><text x="664" y="156" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Keys rotated, history cleaned, access scoped</text><line x1="48" y1="182" x2="1152" y2="182" stroke="#2B2E2B"/><text x="48" y="208" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#6A6E68" text-anchor="start" letter-spacing="0" text-decoration="line-through">Fallbacks that quietly hide failures</text><path d="M575 202H597M591 196L597 202L591 208" fill="none" stroke="#FF4F2B" stroke-width="1.6"/><rect x="640" y="196" width="10" height="10" fill="#FF4F2B"/><text x="664" y="208" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Failures that surface, get logged, get fixed</text><line x1="48" y1="234" x2="1152" y2="234" stroke="#2B2E2B"/><text x="48" y="260" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#6A6E68" text-anchor="start" letter-spacing="0" text-decoration="line-through">Public pages that leak personal data</text><path d="M575 254H597M591 248L597 254L591 260" fill="none" stroke="#FF4F2B" stroke-width="1.6"/><rect x="640" y="248" width="10" height="10" fill="#FF4F2B"/><text x="664" y="260" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Every route reviewed for data exposure</text><line x1="48" y1="286" x2="1152" y2="286" stroke="#2B2E2B"/><text x="48" y="312" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#6A6E68" text-anchor="start" letter-spacing="0" text-decoration="line-through">No privacy, terms or consent handling</text><path d="M575 306H597M591 300L597 306L591 312" fill="none" stroke="#FF4F2B" stroke-width="1.6"/><rect x="640" y="300" width="10" height="10" fill="#FF4F2B"/><text x="664" y="312" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >Policies, consent and security headers audited</text><line x1="48" y1="338" x2="1152" y2="338" stroke="#2B2E2B"/><text x="48" y="364" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#6A6E68" text-anchor="start" letter-spacing="0" text-decoration="line-through">Stock UI that looks like every other app</text><path d="M575 358H597M591 352L597 358L591 364" fill="none" stroke="#FF4F2B" stroke-width="1.6"/><rect x="640" y="352" width="10" height="10" fill="#FF4F2B"/><text x="664" y="364" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#EEEBE4" text-anchor="start" letter-spacing="0" >An interface with its own identity</text><text x="48" y="428" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#8E928B" text-anchor="start" letter-spacing="0" >Classes of failure I find when auditing AI-built apps. The goal is software that survives review, not software that only runs.</text></svg>